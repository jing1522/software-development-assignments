<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>自主实践：太阳、地球与月亮</title>
  <script src="libs/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- 环境：深空背景 + 环境光（A-Frame 的材质没有光就是黑的，必须先打底） -->
    <a-sky color="#05070f"></a-sky>
    <a-light type="ambient" color="#8fa3d0" intensity="0.45"></a-light>

    <!-- 太阳：自发光黄球 + 点光源（照亮地球和月亮）+ 一层淡淡的光晕 -->
    <a-entity id="sun" position="0 2.6 -9">
      <a-sphere radius="1.8" color="#ffd24d" material="emissive: #ff9d00"
                animation="property: scale; to: 1.05 1.05 1.05; dir: alternate; dur: 1800; loop: true"></a-sphere>
      <a-sphere radius="2.05" color="#ffb02e" material="transparent: true; opacity: 0.25"></a-sphere>
      <a-light type="point" color="#ffe0a8" intensity="1.8" distance="60"></a-light>
    </a-entity>

    <!-- 地球轨道线：把公转路径画出来，画面也不空 -->
    <a-ring position="0 2.6 -9" rotation="-90 0 0" radius-inner="5.17" radius-outer="5.23"
            color="#3d4d72" material="transparent: true; opacity: 0.8"></a-ring>

    <!-- 地球：外层组绕太阳转（公转） -->
    <a-entity id="earth-orbit" position="0 2.6 -9"
              animation="property: rotation; to: 0 360 0; dur: 24000; loop: true">
      <!-- 地球本体：自己再绕 Y 轴自转 -->
      <a-entity id="earth" position="4.6 0 2.4">
        <a-sphere radius="0.75" color="#2f7fd6" material="emissive: #0a2440"
                  animation="property: rotation; to: 0 360 0; dur: 14000; loop: true"></a-sphere>

        <!-- 月球轨道线 + 月球：放在地球的组里，转这个组 = 月球绕地球转 -->
        <a-ring rotation="-90 0 0" radius-inner="1.48" radius-outer="1.52"
                color="#4a5570" material="transparent: true; opacity: 0.7"></a-ring>
        <a-entity id="moon-orbit" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true">
          <a-sphere position="1.5 0.12 0" radius="0.22" color="#cfd2d6"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- 星星：远处点缀，让深空不空 -->
    <a-sphere position="-18 9 -30" radius="0.12" color="#ffffff"></a-sphere>
    <a-sphere position="14 12 -34" radius="0.16" color="#e8eeff"></a-sphere>
    <a-sphere position="-25 4 -26" radius="0.10" color="#cfd8ff"></a-sphere>
    <a-sphere position="22 6 -22" radius="0.11" color="#ffffff"></a-sphere>
    <a-sphere position="-9 14 -38" radius="0.14" color="#dfe7ff"></a-sphere>
    <a-sphere position="7 16 -40" radius="0.10" color="#ffffff"></a-sphere>
    <a-sphere position="30 10 -30" radius="0.13" color="#e6ecff"></a-sphere>
    <a-sphere position="-32 12 -34" radius="0.12" color="#ffffff"></a-sphere>

    <!-- 相机初始位：右前方稍高处，平视整个星系 -->
    <a-camera position="1.2 4.2 8"></a-camera>
  </a-scene>
</body>
</html>
